name: Release SnapParse

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v3.0.0)"
        required: true
        default: "v3.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version Tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $ver = $tag.TrimStart("v")
          Write-Host "Resolved Version: $ver (Tag: $tag)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "val=$ver"

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B src-qt/build -S src-qt -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile SnapParse
        shell: pwsh
        run: |
          cmake --build src-qt/build --config Release

      - name: Deploy Qt Runtime Dependencies
        shell: pwsh
        run: |
          windeployqt --release --no-translations src-qt/build/SnapParse.exe

      - name: Build Standalone Single-File Executable
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File src-qt/build_single_exe.ps1

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.val }}"
          $tag = "${{ steps.version.outputs.tag }}"
          
          # 1. Standalone Single-File Portable Executable
          Copy-Item -Path "SnapParse.exe" -Destination "SnapParse-$tag-windows-x64-standalone.exe" -Force
          
          # 2. Complete Distribution Zip (Full runtime folder)
          $stagingDir = "dist_zip_temp"
          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          
          # Copy binary and deployed DLLs/plugins (excluding build cache files)
          Copy-Item "src-qt/build/SnapParse.exe" $stagingDir
          Copy-Item "src-qt/build/*.dll" $stagingDir
          
          $subdirs = @("platforms", "sqldrivers", "imageformats", "iconengines", "styles", "tls", "networkinformation", "generic")
          foreach ($sub in $subdirs) {
              $src = "src-qt/build/$sub"
              if (Test-Path $src) {
                  Copy-Item -Recurse $src "$stagingDir/$sub"
              }
          }
          
          $zipName = "SnapParse-$tag-windows-x64-portable.zip"
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName -Force
          Remove-Item -Recurse -Force $stagingDir
          
          Write-Host "Artifacts prepared:"
          Get-Item "SnapParse.exe", "SnapParse-$tag-windows-x64-standalone.exe", $zipName | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SnapParse ${{ steps.version.outputs.tag }} (Native Qt6 C++ Edition)"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            SnapParse.exe
            SnapParse-*-windows-x64-standalone.exe
            SnapParse-*-windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
